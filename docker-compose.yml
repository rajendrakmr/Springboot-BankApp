services:
  mysql:
    container_name: mysql
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=test@1234
      - MYSQL_DATABASE=bankapp
    networks:
      - bankapp-network
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - 8000:80
    networks:
      - bankapp-network
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: always
  bankapp:
    container_name: bankapplication 
    image: rk0617/bankapp:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bankapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=test@1234 
    ports:
      - 8080:8080
    networks:
      - bankapp-network
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: always

networks:
  bankapp-network:
volumes:
  mysql-data: